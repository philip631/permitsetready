<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Jobs | PermitSetReady</title>
<meta name="description" content="Book a drafting job, follow its progress, check the draft and download the final files.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://permitsetready.ca/start/">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.hide{display:none!important}
.app{min-height:70vh}
.fd{display:grid;gap:14px}
.fd label.l,.lbl{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.fd input:not([type=checkbox]):not([type=radio]),.fd select,.fd textarea,.inp{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box}
.fd2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.fd2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-weight:500;font-size:14px;margin:0;cursor:pointer}.chips input{width:auto;margin:0}
.chips label.on{border-color:var(--amber);background:#FFF8EA}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.opt label{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:block;font-weight:400;cursor:pointer;margin:0}.opt label b{display:block;margin:4px 0 2px}.opt label.on{border:2px solid var(--amber)}.opt input{width:auto;margin:0}
.up{border:1.5px dashed #D6CCB8;border-radius:12px;padding:12px 14px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.up .t{font-size:14px;flex:1;min-width:200px}.up em{font-style:normal;color:var(--muted);font-size:13px}.up .names{display:block;font-size:13px;color:var(--navy);margin-top:4px}
.req{display:inline-block;background:#FDECEA;color:#A33A2B;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:1px 6px;margin-left:6px}
.quoted{border:1px dashed var(--line);border-radius:12px;padding:14px;background:#FBF8F2}
.stepnav{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}.stepnav button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer}.stepnav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.stepnav button.done{color:var(--navy)}
.stp h2{font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:center}.stp h2 i{font-style:normal;background:var(--amber);color:var(--ink);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px;margin:0}.sum dt{color:var(--muted)}.sum dd{margin:0;font-weight:600}
.agree{display:grid;gap:8px}.agree label{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;margin:0}.agree input{width:auto;margin-top:4px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.msg{min-height:20px;font-size:14px;margin:0}.msg.err{color:#A33A2B}
.jobs{display:grid;gap:12px}.job{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer}
.status{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#EEF2F7;color:var(--navy)}.status.act{background:#FFF1D6;color:#8A5E12}.status.done{background:#E6F2EC;color:#2F7A55}
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}.tl div{font-size:12px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}.tl div.on{border-color:var(--amber);color:var(--navy)}
@media(max-width:640px){.tl{grid-template-columns:repeat(3,1fr)}}
.flist{list-style:none;padding:0;margin:6px 0 0;font-size:14px}.flist li{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr.click{cursor:pointer}.tbl tr.click:hover{background:#FBF8F2}
.banner{border:1px solid #F3C978;background:#FBF5E8;border-radius:12px;padding:12px 16px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.reflink{display:flex;gap:8px;flex-wrap:wrap}.reflink input{flex:1;min-width:220px}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav aria-label="Main">
      <a class="logo" href="/" aria-label="PermitSetReady home"><img src="/img/logo-icon-amber.svg" alt="" width="34" height="34"><span><b>PermitSet</b>Ready</span></a>
      <button class="burger" type="button" aria-expanded="false" aria-controls="menu" onclick="var m=document.getElementById('menu');m.classList.toggle('open');this.setAttribute('aria-expanded',m.classList.contains('open'))">Menu</button>
      <div class="menu" id="menu">
        <a href="#jobs" class="authed hide">My jobs</a>
        <a href="#refer" class="authed hide">Refer a firm</a>
        <a href="#admin" class="adm hide">Admin</a>
        <a href="/review/">Set reviews</a>
        <a href="#" id="signout" class="authed hide quiet">Sign out</a>
        <a class="btn btn-amber btn-sm authed hide" href="#new">Book a job</a>
      </div>
    </nav>
  </div>
</header>

<main class="wrap section last app" id="app">
  <p class="muted">Loading…</p>
</main>

<footer class="site-footer">
  <div class="wrap row">
    <a class="logo" href="/"><img src="/img/logo-icon-amber.svg" alt="" width="28" height="28"><span><b>PermitSet</b>Ready</span></a>
    <span>Drafting for Ontario designers, contractors &amp; engineers</span>
    <span class="links"><a href="mailto:admin@permitsetready.ca">admin@permitsetready.ca</a><a href="https://instagram.com/permitsetready" rel="noopener" target="_blank">@permitsetready</a></span>
  </div>
</footer>

<script src="/assets/config.js"></script>
<script>
(function () {
'use strict';
var API = (window.PSR_CONFIG && window.PSR_CONFIG.apiUrl) || '';
var KEY = 'psr_token';
var store = {get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
function api(action, body) {
  if (!API) return Promise.reject(new Error('The portal is being set up. Email admin@permitsetready.ca.'));
  return fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action: action, token: store.get(KEY) || ''}, body || {}))})
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) { if (/log in/i.test(j.error || '')) { store.set(KEY, null); S.user = null; } throw new Error(j.error || 'Something went wrong.'); } return j; });
}
var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function money(n) { return '$' + Number(n || 0).toLocaleString('en-CA'); }
function now() { return new Date().toISOString(); }
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('en-CA', {month: 'short', day: 'numeric', year: 'numeric'}); }
function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
function get(o, k) { return k.split('.').reduce(function (a, b) { return a == null ? undefined : a[b]; }, o); }
function setv(o, k, v) { var p = k.split('.'), x = o; for (var i = 0; i < p.length - 1; i++) { if (typeof x[p[i]] !== 'object' || !x[p[i]]) x[p[i]] = {}; x = x[p[i]]; } x[p[p.length - 1]] = v; }

// ---------- data
var PRO = {wl: {finish: 1050, unit: 1400, bge: 850, garage: 850, deck: 750}, cs: {finish: 1150, unit: 1600, bge: 900, garage: 900, deck: 800}, addon: 0.6, rush: 0.3};
var SCOPES = [['unit', 'Second unit (ARU)'], ['finish', 'Basement finish'], ['bge', 'Below-grade entrance'], ['garage', 'Detached garage'], ['deck', 'Deck'], ['addition', 'Addition'], ['newhome', 'New home'], ['interior', 'Interior alteration'], ['structural', 'Structural drawings'], ['model3d', '3D model'], ['shop', 'Shop drawings'], ['other', 'Other']];
var SNAME = {}; SCOPES.forEach(function (s) { SNAME[s[0]] = s[1]; });
var QUOTED = ['addition', 'newhome', 'structural', 'model3d', 'shop', 'interior', 'other'];
var EXTERIOR = ['unit', 'bge', 'garage', 'deck', 'addition', 'newhome'];
var TIERS = {wl: 'White-label', cs: 'Contractor set'};
var LABEL = {draft: 'Not sent yet', screened: 'Quote within 1 business day', quoted: 'Quote ready', confirmed: 'Started', measuring: 'Site visit', drafting: 'Drafting', review: 'Quality check', consultant: 'With engineer', draftready: 'Draft ready to check', changes: 'Making your changes', ready: 'Balance due', delivered: 'Final files ready', revising: 'Revising for City comments', declined: 'Declined'};
var STAGE = {draft: 0, screened: 1, quoted: 1, confirmed: 2, measuring: 2, drafting: 2, review: 2, consultant: 2, changes: 3, draftready: 3, ready: 4, delivered: 5, revising: 5};
var MUNIS = ['Toronto', 'Mississauga', 'Brampton', 'Caledon', 'Oakville', 'Burlington', 'Milton', 'Halton Hills', 'Vaughan', 'Markham', 'Richmond Hill', 'Hamilton', 'Pickering', 'Ajax', 'Whitby', 'Oshawa', 'Barrie', 'Innisfil', 'Guelph', 'Kitchener'];
var KINDS = [['design', 'Design', 'sketch, markups or SD drawings with dimensions'], ['existing', 'Existing drawings or as-built', 'for renovations'], ['survey', 'Survey', ''], ['template', 'Your title block and a recent set', 'first job only, so we match your standards'], ['notes', 'City comments, engineer notes, truss or HVAC layouts', 'if you have them']];
var S = {user: null, jobs: [], job: null, path: null, files: [], step: 1, admin: {jobs: []}};
function scopes(it) { var a = (it && it.scopes) || []; return SCOPES.map(function (s) { return s[0]; }).filter(function (k) { return a.indexOf(k) >= 0; }); }
function quoted(it) { return scopes(it).filter(function (k) { return QUOTED.indexOf(k) >= 0; }); }
function exterior(it) { return scopes(it).some(function (k) { return EXTERIOR.indexOf(k) >= 0; }); }
function surveyNeeded(it) { return exterior(it); }
function listPrice(it) {
  if (!scopes(it).length || quoted(it).length) return 0;
  var p = PRO[it.tier] || PRO.wl, sum = scopes(it).reduce(function (s, k, i) { var b = p[k] || 0; return s + (i === 0 ? b : Math.round(b * PRO.addon / 50) * 50); }, 0);
  if (it.job && it.job.rush === 'Yes') sum = Math.round(sum * (1 + PRO.rush) / 10) * 10;
  return sum;
}
function priceOf(it) { return (it.quote && Number(it.quote.amount) > 0) ? Number(it.quote.amount) : listPrice(it); }
function paidDeposit(it) { var d = (it.payment || {}).deposit; if (!d) return 0; if (d.net != null && d.net !== '') return Number(d.net) || 0; return Math.round(Number(d.total || 0) / 100 / 1.13); }
function pkg(it) { return (TIERS[it.tier] || 'Job') + ' · ' + (scopes(it).map(function (k) { return SNAME[k]; }).join(' + ') || 'Project'); }
function projPath(uid, pid) { return 'intakes/' + uid + '/projects/' + pid; }
function newId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function blank() {
  var ref = store.get('psr_ref') || '';
  return {id: newId(), owner: S.user.id, createdAt: now(), updatedAt: now(), status: 'draft', tier: 'wl', scopes: [], contact: {email: S.user.email}, property: {}, job: {rush: 'No', deliver: ['pdf', 'model'], pricing: 'fixed'}, docs: {}, measure: {want: false}, referral: ref, ack: {}};
}
function statusPill(st) { var cls = st === 'delivered' ? 'done' : (['quoted', 'draftready', 'ready'].indexOf(st) >= 0 ? 'act' : ''); return '<span class="status ' + cls + '">' + esc(LABEL[st] || st) + '</span>'; }

// ---------- routing
function route() {
  var h = location.hash.replace(/^#/, '') || 'jobs';
  $$('.authed').forEach(function (e) { e.classList.toggle('hide', !S.user); });
  $$('.adm').forEach(function (e) { e.classList.toggle('hide', !(S.user && S.user.isAdmin)); });
  if (!S.user) return viewLogin();
  if (h === 'new') return viewForm(null);
  if (h.indexOf('edit/') === 0) return openJob(h.slice(5), true);
  if (h.indexOf('job/') === 0) return openJob(h.slice(4), false);
  if (h === 'refer') return viewRefer();
  if (h === 'admin') return viewAdmin();
  if (h.indexOf('admin/') === 0) return viewAdminJob(decodeURIComponent(h.slice(6)));
  if (h === 'project' && S.lastPid) return openJob(S.lastPid, false);
  return viewJobs();
}
window.addEventListener('hashchange', route);
function setMain(html) { $('#app').innerHTML = html; window.scrollTo(0, 0); }

// ---------- login
function viewLogin() {
  setMain('<p class="eyebrow">For designers, contractors &amp; engineers</p><h1 style="font-size:clamp(28px,4vw,40px);margin:6px 0 8px">Your jobs, in one place.</h1><p class="muted" style="max-width:640px">Book a drafting job, get a fixed quote, check the draft and download the final files. Sign in with your email; we send you a 6-digit code.</p>' +
    '<div class="card fd" style="max-width:520px;margin-top:20px"><div><label class="l" for="lg_e">Work email</label><input id="lg_e" type="email" autocomplete="email" placeholder="you@firm.ca"></div><div id="lg_cr" class="hide"><label class="l" for="lg_c">6-digit code</label><input id="lg_c" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div><button class="btn btn-amber" id="lg_b" type="button">Email me a code</button></div><p class="msg" id="lg_m" role="status"></p></div>');
  var sent = false, e = $('#lg_e');
  e.value = store.get('psr_email') || '';
  $('#lg_b').onclick = function () {
    var b = this, m = $('#lg_m'); m.className = 'msg'; m.textContent = ''; b.disabled = true;
    var p = sent ? api('auth.verify', {email: e.value.trim(), code: $('#lg_c').value.trim()}).then(function (j) { store.set(KEY, j.token); store.set('psr_email', e.value.trim()); S.user = j.user; route(); })
      : api('auth.start', {email: e.value.trim()}).then(function () { sent = true; $('#lg_cr').classList.remove('hide'); b.textContent = 'Sign in'; m.textContent = 'Code sent. Check your inbox.'; $('#lg_c').focus(); });
    p.catch(function (err) { m.className = 'msg err'; m.textContent = err.message; }).then(function () { b.disabled = false; });
  };
}
$('#signout').onclick = function (ev) { ev.preventDefault(); api('auth.logout').catch(function () {}); store.set(KEY, null); S.user = null; location.hash = ''; route(); };

// ---------- jobs list
function loadJobs() { return api('db.get', {path: 'intakes/' + S.user.id}).then(function (j) { S.jobs = (j.data && j.data.projects) || []; return S.jobs; }); }
function viewJobs() {
  setMain('<p class="muted">Loading your jobs…</p>');
  Promise.all([loadJobs(), api('referral.status').catch(function () { return null; })]).then(function (r) {
    var list = r[0], ref = r[1];
    var toChoose = ref && ref.rewards.filter(function (x) { return x.reward === 'to choose'; }).length;
    var h = '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><p class="eyebrow">Signed in as ' + esc(S.user.email) + '</p><h1 style="font-size:clamp(28px,4vw,38px);margin:6px 0 0">Your jobs</h1></div><a class="btn btn-amber" href="#new">Book a job</a></div>';
    if (toChoose) h += '<div class="banner" style="margin-top:18px"><b>You have a referral reward to choose.</b> <a href="#refer">Pick a free review or $150 off →</a></div>';
    if (ref && ref.credit) h += '<div class="banner" style="margin-top:12px">You have <b>' + money(ref.credit) + '</b> in credit. It comes off your next deposit or balance automatically.</div>';
    h += '<div class="jobs" style="margin-top:20px">' + (list.length ? list.map(function (x) {
      return '<div class="card job" data-id="' + esc(x.id) + '"><div><b>' + esc(x.address || 'New job') + '</b><div class="small">' + esc(x.municipality || '') + (x.scopeName ? ' · ' + esc(x.scopeName) : '') + ' · updated ' + fmtDate(x.updatedAt) + '</div></div>' + statusPill(x.status) + '</div>';
    }).join('') : '<div class="card"><p style="margin:0">No jobs yet. <a href="#new">Book your first job</a>: you get a fixed quote within one business day and nothing is charged until you accept it.</p></div>') + '</div>';
    setMain(h);
    $$('.job').forEach(function (c) { c.onclick = function () { location.hash = 'job/' + c.getAttribute('data-id'); }; });
  }).catch(function (e) { setMain('<p class="msg err">' + esc(e.message) + '</p>'); });
}

// ---------- job form
function openJob(pid, edit) {
  S.lastPid = pid; var path = projPath(S.user.id, pid);
  setMain('<p class="muted">Loading…</p>');
  Promise.all([api('db.get', {path: path}), api('db.list', {path: path + '/files'})]).then(function (r) {
    if (!r[0].exists) throw new Error('Job not found.');
    S.job = r[0].data; S.path = path; S.files = (r[1].docs || []).map(function (d) { var x = d.data; x.id = d.id; return x; });
    if (S.job.status === 'draft' || edit) viewForm(S.job); else viewJob();
  }).catch(function (e) { setMain('<p class="msg err">' + esc(e.message) + '</p><p><a href="#jobs">Back to your jobs</a></p>'); });
}
var saveT = null;
function queueSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 700); var s = $('#savestate'); if (s) s.textContent = 'Saving…'; }
function saveNow() {
  if (!S.job) return Promise.resolve(); S.job.updatedAt = now();
  return api('db.set', {path: S.path, data: S.job}).then(function () { var s = $('#savestate'); if (s) s.textContent = 'Saved'; }).catch(function (e) { var s = $('#savestate'); if (s) s.textContent = 'Not saved: ' + e.message; });
}
function viewForm(it) {
  if (!it) { S.job = blank(); S.path = projPath(S.user.id, S.job.id); S.files = []; history.replaceState(null, '', '#edit/' + S.job.id); S.lastPid = S.job.id; }
  S.step = S.step && S.job.id === S.formId ? S.step : 1; S.formId = S.job.id;
  var j = S.job;
  if (!j.contact.firm && S.jobs.length) {} // keep blank
  var first = !S.jobs.some(function (x) { return x.id !== j.id && x.status && x.status !== 'draft'; });
  var munis = MUNIS.map(function (m) { return '<option>' + m + '</option>'; }).join('');
  var h = '<p class="eyebrow">Book a job</p><h1 style="font-size:clamp(26px,4vw,38px);margin:6px 0 6px">Send us the job. Fixed quote within one business day.</h1><p class="muted" style="max-width:700px;margin:0">Nothing is charged until you accept the quote. <span id="savestate" class="small"></span></p>' +
    '<div class="stepnav" id="stepnav"></div><form class="card fd stp" id="f" style="max-width:780px" novalidate onsubmit="return false">' +
    // 1
    '<div data-step="1" class="fd"><h2><i>1</i>Your firm</h2>' +
    '<div class="fd2"><div><label class="l">Firm name</label><input data-k="contact.firm" autocomplete="organization"></div><div><label class="l">Contact name</label><input data-k="contact.name" autocomplete="name"></div></div>' +
    '<div class="fd2"><div><label class="l">Email</label><input data-k="contact.email" type="email" readonly></div><div><label class="l">Phone (optional)</label><input data-k="contact.phone" type="tel" autocomplete="tel"></div></div>' +
    '<div><span class="lbl">You are</span><div class="chips">' + ['Designer / BCIN', 'Contractor / builder', 'Engineer / consultant', 'Other'].map(function (r) { return '<label><input type="radio" name="role" data-k="contact.role" value="' + r + '"> ' + r + '</label>'; }).join('') + '</div></div>' +
    '<div><label class="l">Referred by another firm? (optional)</label><input data-k="referral" placeholder="Their email or referral code"></div></div>' +
    // 2
    '<div data-step="2" class="fd hide"><h2><i>2</i>Project</h2>' +
    '<div class="fd2"><div><label class="l">Project address</label><input data-k="property.address" autocomplete="off" placeholder="48 Maple Grove Rd"></div><div><label class="l">Municipality</label><input data-k="property.municipality" list="munis" placeholder="Oakville"><datalist id="munis">' + munis + '</datalist></div></div>' +
    '<div><span class="lbl">What are we drawing? (pick all that apply)</span><div class="chips" id="scopes">' + SCOPES.map(function (s) { return '<label><input type="checkbox" value="' + s[0] + '"> ' + s[1] + '</label>'; }).join('') + '</div></div>' +
    '<div class="fd2"><div><label class="l">Existing building</label><input data-k="job.existing" placeholder="e.g. detached house, 1990"></div><div><label class="l">Approx. area of work</label><input data-k="job.area" placeholder="e.g. 85 m² basement"></div></div>' +
    '<div class="fd2"><div><label class="l">Date you need it</label><input data-k="job.due" type="date"></div><div><label class="l">Rush (5 business days, +30%)</label><select data-k="job.rush"><option>No</option><option>Yes</option></select></div></div></div>' +
    // 3

function readFile(f) { return new Promise(function (ok, bad) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { bad(new Error('Could not read ' + f.name)); }; r.readAsDataURL(f); }); }

  saveNow().then(function () {
    var chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () { msg('Uploading ' + f.name + '…'); return readFile(f); }).then(function (data) {
        var id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), rec = {kind: kind, name: f.name, size: f.size, createdAt: now()};

    setMain(h);
    $('#cp').onclick = function () { var i = $('#rl'); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); } toast('Copied'); };
    $$('#app [data-c]').forEach(function (b) { b.onclick = function () { b.disabled = true; api('referral.choose', {id: Number(b.getAttribute('data-id')), choice: b.getAttribute('data-c')}).then(function () { toast('Reward added'); viewRefer(); }).catch(function (e) { b.disabled = false; msg(e.message, true); }); }; });
  }).catch(function (e) { setMain('<p class="msg err">' + esc(e.message) + '</p>'); });
}

// ---------- admin
function viewAdmin() {
  if (!S.user.isAdmin) return viewJobs();
  setMain('<p class="muted">Loading jobs…</p>');
  api('admin.jobs').then(function (r) {
    S.admin.jobs = r.jobs || [];
    var f = store.get('psr_adm_filter') || 'open';
    var open = function (x) { return ['Delivered', 'Not eligible', 'Declined', LABEL.delivered].indexOf(x.Status) < 0; };
    var rows = S.admin.jobs.slice().reverse().filter(function (x) { return f === 'all' || open(x); });
    setMain('<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><h1 style="font-size:clamp(26px,4vw,36px);margin:0">Admin · jobs</h1><div class="chips"><label class="' + (f === 'open' ? 'on' : '') + '"><input type="radio" name="af" value="open"' + (f === 'open' ? ' checked' : '') + '> Open</label><label class="' + (f === 'all' ? 'on' : '') + '"><input type="radio" name="af" value="all"' + (f === 'all' ? ' checked' : '') + '> All</label></div></div>' +
      '<div class="card" style="margin-top:16px;overflow:auto"><table class="tbl"><thead><tr><th>PSR</th><th>Client</th><th>Address</th><th>Package</th><th>Price</th><th>Status</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (x) { return '<tr class="click" data-p="' + esc(x.Path) + '"><td>' + esc(x.PSR) + '</td><td>' + esc(x.Client) + '<div class="small">' + esc(x.Email) + '</div></td><td>' + esc(x.Address) + ', ' + esc(x.Municipality) + '</td><td>' + esc(x.Package) + '</td><td>' + esc(typeof x.Price === 'number' ? money(x.Price) : x.Price) + '</td><td>' + esc(x.Status) + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="muted">No jobs.</td></tr>') + '</tbody></table></div>' +
      '<p class="small" style="margin-top:12px">Homeowner leads, referrals, credits and reviews are on the Leads, Referrals, Credits and Reviews tabs of the Jobs sheet.</p>');
    $$('input[name=af]').forEach(function (i) { i.onchange = function () { store.set('psr_adm_filter', i.value); viewAdmin(); }; });
    $$('#app tr.click').forEach(function (tr) { tr.onclick = function () { location.hash = 'admin/' + encodeURIComponent(tr.getAttribute('data-p')); }; });
  }).catch(function (e) { setMain('<p class="msg err">' + esc(e.message) + '</p>'); });
}
function viewAdminJob(path) {
  setMain('<p class="muted">Loading…</p>');
  Promise.all([api('db.get', {path: path}), api('db.list', {path: path + '/files'}), api('files.draft', {path: path})]).then(function (r) {
    var j = r[0].data, files = (r[1].docs || []).map(function (d) { return d.data; }), drafts = r[2].files || [], sv = j.server || {}, row = S.admin.jobs.filter(function (x) { return x.Path === path; })[0] || {};
    var lp = listPrice(j), dep = j.quote && j.quote.deposit != null ? j.quote.deposit : (typeof row.Deposit === 'number' ? row.Deposit : Math.round((lp || 0) * 0.5));
    var h = '<p><a href="#admin">← All jobs</a></p><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end"><div><p class="eyebrow">' + esc((sv.psr || '') + ' · ' + pkg(j)) + '</p><h1 style="font-size:clamp(24px,4vw,34px);margin:6px 0 0">' + esc(j.property.address || '') + ', ' + esc(j.property.municipality || '') + '</h1></div>' + statusPill(j.status) + '</div>' +
      '<div class="grid-2" style="margin-top:16px;align-items:start"><div class="card"><b>Job</b><dl class="sum" style="margin-top:8px"><dt>Firm</dt><dd>' + esc(j.contact.firm || '') + ' · ' + esc(j.contact.name || '') + '</dd><dt>Email</dt><dd>' + esc(j.contact.email || '') + ' ' + esc(j.contact.phone || '') + '</dd><dt>Role</dt><dd>' + esc(j.contact.role || '') + '</dd>' +
      '<dt>Scope</dt><dd>' + esc(pkg(j)) + (j.job && j.job.rush === 'Yes' ? ' · RUSH' : '') + '</dd><dt>List price</dt><dd>' + (lp ? money(lp) : 'quote (' + esc(quoted(j).map(function (k) { return SNAME[k]; }).join(', ')) + ')') + '</dd>' +
      (j.job && j.job.budget ? '<dt>Their budget</dt><dd>' + esc(j.job.budget) + ' (' + esc(j.job.budgetType || '') + ')</dd>' : '') + (j.job && j.job.pricing === 'hourly' ? '<dt>Pricing</dt><dd>$85/hour requested</dd>' : '') +
      '<dt>Needed by</dt><dd>' + esc((j.job || {}).due || '') + '</dd><dt>Building</dt><dd>' + esc((j.job || {}).existing || '') + ' · ' + esc((j.job || {}).area || '') + '</dd><dt>Deliver</dt><dd>' + esc(((j.job || {}).deliver || []).join(', ')) + '</dd>' +
      '<dt>Site visit</dt><dd>' + (j.measure && j.measure.want ? 'Yes · ' + esc(j.measure.sqft || '?') + ' sq ft' : 'No') + '</dd><dt>Referral</dt><dd>' + esc(j.referral || '') + '</dd>' +
      '<dt>Links</dt><dd>' + (j.docs && j.docs.link ? '<a href="' + esc(j.docs.link) + '" target="_blank" rel="noopener">Shared folder</a> ' : '') + (j.docs && j.docs.inspiration ? '<a href="' + esc(j.docs.inspiration) + '" target="_blank" rel="noopener">Inspiration</a> ' : '') + (sv.folderUrl ? '<a href="' + esc(sv.folderUrl) + '" target="_blank" rel="noopener">Job folder</a>' : '') + '</dd>' +
      '<dt>Notes</dt><dd style="font-weight:400">' + esc((j.docs || {}).notes || '') + '</dd>' + (j.clientNotes ? '<dt>Changes</dt><dd style="font-weight:400">' + esc(j.clientNotes) + '</dd>' : '') + '</dl>' +
      '<b style="display:block;margin-top:14px">Files</b><ul class="flist">' + files.map(function (f) { return '<li><span>' + esc(f.kind) + ' · ' + esc(f.name) + '</span>' + (f.driveUrl ? '<a href="' + esc(f.driveUrl) + '" target="_blank" rel="noopener">Open</a>' : '') + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card fd"><b>Quote</b><div class="fd2"><div><label class="l">Price (before HST)</label><input id="q_a" type="number" value="' + esc((j.quote && j.quote.amount) || lp || '') + '"></div><div><label class="l">Deposit</label><input id="q_d" type="number" value="' + esc(dep) + '"></div></div><div><label class="l">Delivery</label><input id="q_t" value="' + esc((j.quote && j.quote.days) || '7–10 business days') + '"></div><div><label class="l">Note to the client (optional)</label><textarea id="q_n" rows="2">' + esc((j.quote && j.quote.note) || '') + '</textarea></div><div><button class="btn btn-amber btn-sm" id="q_send">' + (j.quote ? 'Update and resend quote' : 'Send quote') + '</button></div>' +
      '<b style="margin-top:8px">Progress</b><div class="chips">' + [['drafting', 'Start drafting'], ['review', 'Quality check'], ['draftready', 'Send draft (' + drafts.length + ' file' + (drafts.length === 1 ? '' : 's') + ' in Draft)'], ['ready', 'Balance due'], ['delivered', 'Release finals'], ['revising', 'Revising'], ['declined', 'Decline']].map(function (s) { return '<button type="button" class="btn btn-line btn-sm" data-st="' + s[0] + '">' + esc(s[1]) + '</button>'; }).join('') + '</div>' +
      '<div><label class="l">Expected draft date (shown to the client)</label><input id="a_eta" value="' + esc((j.admin || {}).eta || '') + '" placeholder="e.g. Oct 24"></div><div><label class="l">Internal notes</label><textarea id="a_n" rows="3">' + esc((j.admin || {}).notes || '') + '</textarea></div><div><button class="btn btn-line btn-sm" id="a_save">Save notes</button></div>' +
      '<p class="small" style="margin:0">Put the watermarked review PDF in the job folder\'s <b>Draft</b> subfolder before sending the draft, and the final PDFs and model in <b>PDF</b> before releasing finals.</p><p class="msg" id="fmsg"></p></div></div>';
    setMain(h);
    var upd = function (data, btn) { btn.disabled = true; return api('db.set', {path: path, data: data, merge: true}).then(function () { toast('Saved'); viewAdminJob(path); }).catch(function (e) { btn.disabled = false; msg(e.message, true); }); };
    $('#q_send').onclick = function () { var a = Number($('#q_a').value); if (!(a > 0)) { msg('Enter the price.', true); return; } upd({status: 'quoted', quote: {amount: a, deposit: Number($('#q_d').value) || 0, days: $('#q_t').value.trim(), note: $('#q_n').value.trim(), at: now()}}, this); };
    $('#a_save').onclick = function () { upd({admin: Object.assign({}, j.admin || {}, {notes: $('#a_n').value, eta: $('#a_eta').value.trim()})}, this); };
    $$('#app [data-st]').forEach(function (b) { b.onclick = function () {
      var st = b.getAttribute('data-st');
      if (st === 'draftready' && !drafts.length) { msg('Put the watermarked draft PDF in the job folder\'s Draft subfolder first.', true); return; }
      if (st === 'declined') { var why = prompt('Reason shown to the client:'); if (why == null) return; return upd({status: 'declined', admin: Object.assign({}, j.admin || {}, {declineNote: why})}, b); }
      upd({status: st}, b);
    }; });
  }).catch(function (e) { setMain('<p class="msg err">' + esc(e.message) + '</p>'); });
}

// ---------- boot
function boot() {
  var q = new URLSearchParams(location.search), paid = q.get('paid');
  var start = store.get(KEY) ? api('auth.me').then(function (j) { S.user = j.user; }).catch(function () { S.user = null; }) : Promise.resolve();
  start.then(function () {
    if (paid) { history.replaceState(null, '', location.pathname + location.hash); return api('pay.confirm', {session: paid}).then(function () { toast('Payment received. Thank you.'); }).catch(function () {}); }
  }).then(function () { if (S.user) return loadJobs().catch(function () {}); }).then(route);
}
boot();
})();
</script>
