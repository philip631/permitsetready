<link rel="stylesheet" href="/assets/site.css">
<style>
.hide{display:none!important}
.app{min-height:70vh}
.fd{display:grid;gap:14px}
.fd label.l,.lbl{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.fd input:not([type=checkbox]):not([type=radio]),.fd select,.fd textarea,.inp{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box}
.fd2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.fd2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-weight:500;font-size:14px;margin:0;cursor:pointer}.chips input{width:auto;margin:0}
.chips label.on{border-color:var(--amber);background:#FFF8EA}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.opt label{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:block;font-weight:400;cursor:pointer;margin:0}.opt label b{display:block;margin:4px 0 2px}.opt label.on{border:2px solid var(--amber)}.opt input{width:auto;margin:0}
.up{border:1.5px dashed #D6CCB8;border-radius:12px;padding:12px 14px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.up .t{font-size:14px;flex:1;min-width:200px}.up em{font-style:normal;color:var(--muted);font-size:13px}.up .names{display:block;font-size:13px;color:var(--navy);margin-top:4px}
.mk{margin-top:14px}.mk .pg{position:relative;margin:0 0 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:crosshair}.mk .pg.ro{cursor:default}.mk canvas{display:block;width:100%;height:auto}.mk .pin{position:absolute;transform:translate(-50%,-100%);background:#C2410C;color:#fff;font:700 12px/1 Inter,sans-serif;border-radius:12px 12px 12px 0;padding:5px 8px;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}.mk .lbl2{font-size:12px;color:var(--muted);margin:0 0 4px}.mklist{list-style:none;padding:0;margin:8px 0 0}.mklist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;margin:6px 0}.mklist b{background:#C2410C;color:#fff;border-radius:10px;padding:2px 7px;font-size:12px}.mklist textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.up.busy{border-color:var(--amber);background:#FFF8EA}.spin{display:inline-block;width:14px;height:14px;border:2px solid #E8D9B8;border-top-color:var(--amber);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.req{display:inline-block;background:#FDECEA;color:#A33A2B;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:1px 6px;margin-left:6px}
.quoted{border:1px dashed var(--line);border-radius:12px;padding:14px;background:#FBF8F2}
.stepnav{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}.stepnav button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer}.stepnav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.stepnav button.done{color:var(--navy)}
.stp h2{font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:center}.stp h2 i{font-style:normal;background:var(--amber);color:var(--ink);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px;margin:0}.sum dt{color:var(--muted)}.sum dd{margin:0;font-weight:600}
.agree{display:grid;gap:8px}.agree label{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;margin:0}.agree input{width:auto;margin-top:4px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.msg{min-height:20px;font-size:14px;margin:0}.msg.err{color:#A33A2B}
.jobs{display:grid;gap:12px}.job{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer}
.status{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#EEF2F7;color:var(--navy)}.status.act{background:#FFF1D6;color:#8A5E12}.status.done{background:#E6F2EC;color:#2F7A55}
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}.tl div{font-size:12px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}.tl div.on{border-color:var(--amber);color:var(--navy)}
@media(max-width:640px){.tl{grid-template-columns:repeat(3,1fr)}}
.flist{list-style:none;padding:0;margin:6px 0 0;font-size:14px}.flist li{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr.click{cursor:pointer}.tbl tr.click:hover{background:#FBF8F2}
.banner{border:1px solid #F3C978;background:#FBF5E8;border-radius:12px;padding:12px 16px;font-size:14px}
.addr-wrap{position:relative}.addr-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #E8E0D2;border-radius:12px;box-shadow:0 14px 30px rgba(14,31,54,.18);list-style:none;margin:0;padding:6px;z-index:40;max-height:300px;overflow:auto}.addr-list li{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1.35}.addr-list li small{display:block;color:#5B6B7F;font-size:13px}.addr-list li[aria-selected=true],.addr-list li:hover{background:#FBF5E8}.addr-list li.src{cursor:default;font-size:11px;color:#8A97A8;padding:4px 12px}.addr-list li.src:hover{background:none}
.ovl{position:fixed;inset:0;background:rgba(15,30,50,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px)}.ovl .box{background:#fff;border-radius:16px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}.ovl .big,.bigspin{display:block;width:54px;height:54px;border:5px solid #E8D9B8;border-top-color:var(--amber);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto 18px}.ovl b{display:block;font-size:20px;color:var(--navy)}.ovl p{margin:8px 0 0;color:var(--muted);font-size:15px}.pscard{text-align:center;padding:18px 6px}.pscard .steps{list-style:none;padding:0;margin:14px auto 0;max-width:360px;text-align:left}.pscard .steps li{padding:5px 0;color:var(--muted);font-size:15px}.pscard .steps li.on{color:var(--navy);font-weight:700}.pscard .steps li.done{color:var(--navy)}.pscard .steps li.done:before{content:'\2713  ';color:var(--amber)}.pscard .steps li.on:before{content:'\2022  ';color:var(--amber)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.reflink{display:flex;gap:8px;flex-wrap:wrap}.reflink input{flex:1;min-width:220px}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <nav aria-label="Main">
      <a class="logo" href="/" aria-label="PermitSetReady home"><img src="/img/logo-icon-amber.svg" alt="" width="34" height="34"><span><b>PermitSet</b>Ready</span></a>
      <button class="burger" type="button" aria-expanded="false" aria-controls="menu" onclick="var m=document.getElementById('menu');m.classList.toggle('open');this.setAttribute('aria-expanded',m.classList.contains('open'))">Menu</button>
      <div class="menu" id="menu">
        <a href="#jobs" class="authed hide">My jobs</a>
        <a href="#refer" class="authed hide">Refer a firm</a>
        <a href="#admin" class="adm hide">Admin</a>
        <a href="/review/">Set reviews</a>
        <a href="#" id="signout" class="authed hide quiet">Sign out</a>
        <a class="btn btn-amber btn-sm authed hide" href="#new">Book a job</a>
      </div>
    </nav>
  </div>
</header>

<main class="wrap section last app" id="app">
  <p class="muted">Loading…</p>
</main>

<footer class="site-footer">
  <div class="wrap row">
    <a class="logo" href="/"><img src="/img/logo-icon-amber.svg" alt="" width="28" height="28"><span><b>PermitSet</b>Ready</span></a>
    <span>Drafting for Ontario designers, contractors &amp; engineers</span>
    <span class="links"><a href="mailto:admin@permitsetready.ca">admin@permitsetready.ca</a><a href="https://instagram.com/permitsetready" rel="noopener" target="_blank">@permitsetready</a><a href="/terms/">Terms</a></span>
  </div>
</footer>

<script src="/assets/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
'use strict';
var API = (window.PSR_CONFIG && window.PSR_CONFIG.apiUrl) || '';
var KEY = 'psr_token';
var store = {get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
function api(action, body) {
  if (!API) return Promise.reject(new Error('The portal is being set up. Email admin@permitsetready.ca.'));
  return fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action: action, token: store.get(KEY) || ''}, body || {}))})
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) { if (/log in/i.test(j.error || '')) { store.set(KEY, null); S.user = null; } throw new Error(j.error || 'Something went wrong.'); } return j; });
}
var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function money(n) { return '$' + Number(n || 0).toLocaleString('en-CA'); }
function now() { return new Date().toISOString(); }
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('en-CA', {month: 'short', day: 'numeric', year: 'numeric'}); }
function overlay(title, sub) { hideOverlay(); var o = document.createElement('div'); o.className = 'ovl'; o.id = 'ovl'; o.setAttribute('role', 'alertdialog'); o.setAttribute('aria-busy', 'true'); o.innerHTML = '<div class="box"><span class="big" aria-hidden="true"></span><b>' + esc(title) + '</b>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>'; document.body.appendChild(o); }
function hideOverlay() { var o = document.getElementById('ovl'); if (o) o.remove(); }
function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
function get(o, k) { return k.split('.').reduce(function (a, b) { return a == null ? undefined : a[b]; }, o); }
function setv(o, k, v) { var p = k.split('.'), x = o; for (var i = 0; i < p.length - 1; i++) { if (typeof x[p[i]] !== 'object' || !x[p[i]]) x[p[i]] = {}; x = x[p[i]]; } x[p[p.length - 1]] = v; }

// ---------- data
var PRO = {wl: {finish: 1050, unit: 1400, bge: 850, garage: 850, deck: 750}, cs: {finish: 1150, unit: 1600, bge: 900, garage: 900, deck: 800}, addon: 0.6, rush: 0.3};
var SCOPES = [['unit', 'Second unit (ARU)'], ['finish', 'Basement finish'], ['bge', 'Below-grade entrance'], ['garage', 'Detached garage'], ['deck', 'Deck'], ['addition', 'Addition'], ['newhome', 'New home'], ['interior', 'Interior alteration'], ['structural', 'Structural drawings'], ['model3d', '3D model'], ['shop', 'Shop drawings'], ['other', 'Other']];
var SNAME = {}; SCOPES.forEach(function (s) { SNAME[s[0]] = s[1]; });
var QUOTED = ['addition', 'newhome', 'structural', 'model3d', 'shop', 'interior', 'other'];
var EXTERIOR = ['unit', 'bge', 'garage', 'deck', 'addition', 'newhome'];
var TIERS = {wl: 'White-label', cs: 'Contractor set'};
var LABEL = {info: 'Needs your input', draft: 'Not sent yet', screened: 'Being checked', quoted: 'Ready to start', confirmed: 'Started', measuring: 'Site visit', drafting: 'Drafting', review: 'Quality check', consultant: 'With engineer', draftready: 'Draft ready to check', changes: 'Making your changes', ready: 'Balance due', delivered: 'Final files ready', revising: 'Revising for City comments', declined: 'Declined'};
var STAGE = {draft: 0, screened: 1, info: 1, quoted: 1, confirmed: 2, measuring: 2, drafting: 2, review: 2, consultant: 2, changes: 3, draftready: 3, ready: 4, delivered: 5, revising: 5};
var MUNIS = ['Toronto', 'Mississauga', 'Brampton', 'Caledon', 'Oakville', 'Burlington', 'Milton', 'Halton Hills', 'Vaughan', 'Markham', 'Richmond Hill', 'Hamilton', 'Pickering', 'Ajax', 'Whitby', 'Oshawa', 'Barrie', 'Innisfil', 'Guelph', 'Kitchener'];
var KINDS = [['design', 'Design', 'sketch, markups or SD drawings with dimensions'], ['existing', 'Existing drawings or as-built', 'for renovations'], ['survey', 'Survey', ''], ['permits', 'Previous permits for this property', 'issued permits or permit drawings, if any'], ['template', 'Your template and 1–2 sample projects', ''], ['notes', 'City comments, engineer notes, truss or HVAC layouts', 'if you have them']];
var S = {user: null, jobs: [], job: null, path: null, files: [], step: 1, admin: {jobs: []}};
function scopes(it) { var a = (it && it.scopes) || []; return SCOPES.map(function (s) { return s[0]; }).filter(function (k) { return a.indexOf(k) >= 0; }); }
function quoted(it) { return (it.job && it.job.fromBrief) ? scopes(it) : scopes(it).filter(function (k) { return QUOTED.indexOf(k) >= 0; }); }
function exterior(it) { return scopes(it).some(function (k) { return EXTERIOR.indexOf(k) >= 0; }); }
function surveyNeeded(it) { return exterior(it); }
function listPrice(it) {
  if (!scopes(it).length || quoted(it).length) return 0;
  var p = PRO[it.tier] || PRO.wl, sum = scopes(it).reduce(function (s, k, i) { var b = p[k] || 0; return s + (i === 0 ? b : Math.round(b * PRO.addon / 50) * 50); }, 0);
  if (it.job && it.job.rush === 'Yes') sum = Math.round(sum * (1 + PRO.rush) / 10) * 10;
  return sum;
}
function priceOf(it) { return (it.quote && Number(it.quote.amount) > 0) ? Number(it.quote.amount) : listPrice(it); }
function paidDeposit(it) { var d = (it.payment || {}).deposit; if (!d) return 0; if (d.comped) return priceOf(it); if (d.net != null && d.net !== '') return Number(d.net) || 0; return Math.round(Number(d.total || 0) / 100 / 1.13); }
function pkg(it) { return (TIERS[it.tier] || 'Job') + ' · ' + (scopes(it).map(function (k) { return SNAME[k]; }).join(' + ') || 'Project'); }
function projPath(uid, pid) { return 'intakes/' + uid + '/projects/' + pid; }
function newId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function blank() {
  var ref = store.get('psr_ref') || '';
  return {id: newId(), owner: S.user.id, createdAt: now(), updatedAt: now(), status: 'draft', tier: 'wl', scopes: [], contact: {email: S.user.email}, property: {}, job: {rush: 'No', deliver: ['pdf', 'dwg'], pricing: 'fixed'}, docs: {}, measure: {want: false}, referral: ref, ack: {}};
}
function jobPill(j) {
  var st = j.status, ps = (j.server || {}).prescreen || {};
  if (st === 'screened') { var t = (ps.state === 'pending' || ps.state === 'running') ? 'Pre-screening' : (listPrice(j) ? (ps.state === 'review' ? 'Pre-screen: needs your look' : 'Price check') : 'Quote needed'); return '<span class="status act">' + esc(t) + '</span>'; }
  return statusPill(st);
}
function statusPill(st) { var cls = st === 'delivered' ? 'done' : (['quoted', 'draftready', 'ready'].indexOf(st) >= 0 ? 'act' : ''); return '<span class="status ' + cls + '">' + esc(LABEL[st] || st) + '</span>'; }

// ---------- routing
function route() {
  var h = location.hash.replace(/^#/, '') || 'jobs';
  $$('.authed').forEach(function (e) { e.classList.toggle('hide', !S.user); });
  $$('.adm').forEach(function (e) { e.classList.toggle('hide', !(S.user && S.user.isAdmin)); });
  if (!S.user) return viewLogin();
  if (h === 'new') return viewForm(null);
  if (h.indexOf('edit/') === 0) return openJob(h.slice(5), true);
  if (h.indexOf('job/') === 0) return openJob(h.slice(4), false);
  if (h === 'refer') return viewRefer();
  if (h === 'admin') return viewAdmin();
  if (h === 'admin/costs') return viewCosts();
  if (h.indexOf('admin/') === 0) return S.user && S.user.isAdmin ? viewAdminJob(decodeURIComponent(h.slice(6))) : viewJobs();
  if (h === 'project' && S.lastPid) return openJob(S.lastPid, false);
  return viewJobs();
}
window.addEventListener('hashchange', route);
function setMain(html) { $('#app').innerHTML = html; window.scrollTo(0, 0); }

// ---------- login
function viewLogin() {
  setMain('<p class="eyebrow">For designers, contractors &amp; engineers</p><h1 style="font-size:clamp(28px,4vw,40px);margin:6px 0 8px">Your jobs, in one place.</h1><p class="muted" style="max-width:640px">Book a drafting job, get your price, check the draft and download the final files. Sign in with your email; we send you a 6-digit code.</p>' +
    '<div class="card fd" style="max-width:520px;margin-top:20px"><div><label class="l" for="lg_e">Work email</label><input id="lg_e" type="email" autocomplete="email" placeholder="you@firm.ca"></div><div id="lg_cr" class="hide"><label class="l" for="lg_c">6-digit code</label><input id="lg_c" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div><button class="btn btn-amber" id="lg_b" type="button">Email me a code</button></div><p class="msg" id="lg_m" role="status"></p></div>');
  var sent = false, e = $('#lg_e');
  e.value = store.get('psr_email') || '';
  $('#lg_b').onclick = function () {
    var b = this, m = $('#lg_m'); m.className = 'msg'; m.textContent = ''; b.disabled = true;
    var p = sent ? api('auth.verify', {email: e.value.trim(), code: $('#lg_c').value.trim()}).then(function (j) { store.set(KEY, j.token); store.set('psr_email', e.value.trim()); S.user = j.user; route(); })
      : api('auth.start', {email: e.value.trim()}).then(function () { sent = true; $('#lg_cr').classList.remove('hide'); b.textContent = 'Sign in'; m.textContent = 'Code sent. Check your inbox.'; $('#lg_c').focus(); });
    p.catch(function (err) { m.className = 'msg err'; m.textContent = err.message; }).then(function () { b.disabled = false; });
  };
}
$('#signout').onclick = function (ev) { ev.preventDefault(); api('auth.logout').catch(function () {}); store.set(KEY, null); S.user = null; location.hash = ''; route(); };

// ---------- jobs list
function loadJobs() { return api('db.get', {path: 'intakes/' + S.user.id}).then(function (j) { S.jobs = (j.data && j.data.projects) || []; return S.jobs; }); }
function viewJobs() {
  setMain('<p class="muted">Loading your jobs…</p>');
  Promise.all([loadJobs(), api('referral.status').catch(function () { return null; })]).then(function (r) {
    var list = r[0], ref = r[1];
    var toChoose = ref && ref.rewards.filter(function (x) { return x.reward === 'to choose'; }).length;
    var h = '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><p class="eyebrow">Signed in as ' + esc(S.user.email) + '</p><h1 style="font-size:clamp(28px,4vw,38px);margin:6px 0 0">Your jobs</h1></div><a class="btn btn-amber" href="#new">Book a job</a></div>';
    if (toChoose) h += '<div class="banner" style="margin-top:18px"><b>You have a referral reward to choose.</b> <a href="#refer">Pick a free review or $150 off →</a></div>';
    if (ref && ref.credit) h += '<div class="banner" style="margin-top:12px">You have <b>' + money(ref.credit) + '</b> in credit. It comes off your next deposit or balance automatically.</div>';
    h += '<div class="jobs" style="margin-top:20px">' + (list.length ? list.map(function (x) {
      return '<div class="card job" data-id="' + esc(x.id) + '"><div><b>' + esc(x.address || 'New job') + '</b><div class="small">' + esc(x.municipality || '') + (x.scopeName ? ' · ' + esc(x.scopeName) : '') + ' · updated ' + fmtDate(x.updatedAt) + '</div></div>' + statusPill(x.status) + '</div>';
    }).join('') : '<div class="card"><p style="margin:0">No jobs yet. <a href="#new">Book your first job</a>: we pre-screen your files and send your price or fixed quote within one business day. Nothing is charged until you start.</p></div>') + '</div>';
    setMain(h);
    $$('.job').forEach(function (c) { c.onclick = function () { location.hash = 'job/' + c.getAttribute('data-id'); }; });
  }).catch(function (e) { setMain('<p class="msg err">' + esc(e.message) + '</p>'); });
}

// ---------- job form
function jobSig(j, files) { var ps = ((j || {}).server || {}).prescreen || {}; return [(j || {}).status, ps.state, ps.round, (files || []).length].join('|'); }
function openJob(pid, edit, quiet) {
  S.lastPid = pid; var path = projPath(S.user.id, pid);
  if (!quiet) setMain('<p class="muted">Loading…</p>');

  var q = new URLSearchParams(location.search), paid = q.get('paid');
  var start = store.get(KEY) ? api('auth.me').then(function (j) { S.user = j.user; }).catch(function () { S.user = null; }) : Promise.resolve();
  start.then(function () {
    if (paid) { history.replaceState(null, '', location.pathname + location.hash); return api('pay.confirm', {session: paid}).then(function () { toast('Payment received. Thank you.'); }).catch(function () {}); }
  }).then(function () { if (S.user) return loadJobs().catch(function () {}); }).then(route);
}
boot();
})();
</script>
